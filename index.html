<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFONG'S ARCADE</title>
  <link rel="stylesheet" href="styles/arcade.css">
</head>
<body>
  <header class="arcade-header">
    <h1 class="arcade-title">RFONG'S ARCADE</h1>
    <p class="arcade-subtitle">INSERT COIN TO PLAY</p>
  </header>

  <main class="arcade-grid">
    <a class="game-card" href="games/laser-tag/index.html">
      <h2 class="game-card__title">LASER TAG</h2>
      <span class="game-card__badge">PLAY</span>
      <p class="game-card__desc">Last ship flying wins</p>
    </a>

    <div class="game-card game-card--soon">
      <h2 class="game-card__title">ASTEROIDS</h2>
      <span class="game-card__badge game-card__badge--soon">COMING SOON</span>
      <p class="game-card__desc">Dodge and blast rocks</p>
    </div>

    <div class="game-card game-card--soon">
      <h2 class="game-card__title">BREAKOUT</h2>
      <span class="game-card__badge game-card__badge--soon">COMING SOON</span>
      <p class="game-card__desc">Smash every brick</p>
    </div>
  </main>
</body>
</html>
